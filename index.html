<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Optimised Site</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
            background-color: #f9f9f9;
        }
        main {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1rem;
            line-height: 1.5;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <main>
        <h1>Welcome to My Mobile Site</h1>
        <p>This content area scales perfectly across all mobile devices. The header and footer are loaded dynamically from separate HTML files.</p>
    </main>

    <div id="footer-container"></div>

    <script>
        async function loadComponent(file, elementId) {
            try {
                const response = await fetch(file);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(elementId).innerHTML = html;
                }
            } catch (error) {
                console.error("Error loading component:", error);
            }
        }

        loadComponent('header.html', 'header-container');
        loadComponent('footer.html', 'footer-container');
    </script>
</body>
</html>
